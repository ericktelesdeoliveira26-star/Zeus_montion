
name: Build Zeus Motion APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ZeusMotion-Android-Project-v2.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair projeto
        run: |
          unzip ZeusMotion-Android-Project-v2.zip -d source
          find source -name settings.gradle.kts -print

      - name: Compilar APK
        run: |
          cd source/ZeusMotionBuild
          gradle assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Zeus-Motion-APK
          path: source/ZeusMotionBuild/app/build/outputs/apk/debug/app-debug.apk
          
